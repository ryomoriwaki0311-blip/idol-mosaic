<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Idol Mosaic v3</title>
<style>
body{margin:0;background:#0b0d12;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 16px 40px}.card{background:#151922;border:1px solid #283040;border-radius:20px;padding:16px;margin:13px 0}.step{font-weight:800;font-size:17px;margin-bottom:12px}.sub,.note,.meta{color:#939caf;font-size:12px;line-height:1.6}.filebox{display:block;border:1px dashed #46526b;border-radius:15px;padding:16px;text-align:center;background:#0f131b;font-weight:700}input[type=file]{display:none}.stage{position:relative;background:#050608;border-radius:16px;overflow:hidden;min-height:220px;display:grid;place-items:center}.hint{color:#939caf;padding:40px 20px;text-align:center}video{display:none;width:100%;max-height:66vh;background:#000}canvas{display:none;position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}.seekrow{display:none;margin-top:12px}input[type=range]{width:100%}.labels{display:flex;justify-content:space-between;color:#939caf;font-size:11px}.status{margin-top:10px;font-size:13px}.good{color:#9ee6af}.warn{color:#ffd479}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;background:#242b3a;color:#fff}button:disabled{opacity:.4}
</style></head><body><div class="wrap">
<h1>アイドル以外モザイク <small style="font-size:12px;color:#939caf">v3</small></h1>
<div class="sub">人物をAI検出し、タップした人物を再生中に追跡する実機テスト版。</div>

<section class="card"><div class="step">1. 動画を選ぶ</div><label class="filebox" for="file">動画を選択</label><input id="file" type="file" accept="video/*"><div id="meta" class="meta"></div><div id="model" class="status">AIモデル：読み込み中…</div></section>

<section class="card"><div class="step">2. 残したい人物を選ぶ</div><div class="stage"><div id="hint" class="hint">動画を選ぶとAIが人物を探します</div><video id="video" playsinline muted preload="metadata"></video><canvas id="canvas"></canvas></div><div id="seekrow" class="seekrow"><input id="seek" type="range" min="0" max="1000" value="0"><div class="labels"><span>フレーム位置</span><span id="time">0:00</span></div></div><div id="target" class="status">まだ指定されていません</div><div class="row"><button id="play" disabled>▶ 追跡テスト</button><button id="reset" disabled>指定やり直し</button></div><div class="note">青い枠＝検出した人物。残したい人物の枠内をタップしてください。</div></section>

<section class="card"><div class="step">3. 追跡結果</div><div id="track" class="status">人物を選ぶと同じ人物を追います。</div><div class="note">v3は追跡精度確認用。モザイク書き出しは次段階。</div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const q=id=>document.getElementById(id),file=q('file'),video=q('video'),canvas=q('canvas'),ctx=canvas.getContext('2d'),hint=q('hint'),meta=q('meta'),modelEl=q('model'),seek=q('seek'),seekrow=q('seekrow'),timeEl=q('time'),targetEl=q('target'),play=q('play'),reset=q('reset'),track=q('track');
let mdl=null,dets=[],target=null,url=null,busy=false,tracking=false,last=0;
const ft=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
async function load(){try{await tf.ready();mdl=await cocoSsd.load({base:'lite_mobilenet_v2'});modelEl.innerHTML='<span class="good">AIモデル：準備完了 ✓</span>';if(video.readyState>=2)detect();}catch(e){modelEl.innerHTML='<span class="warn">AIモデル読み込み失敗</span>';}}
load();
function fit(){const r=video.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*devicePixelRatio));canvas.height=Math.max(1,Math.round(r.height*devicePixelRatio));}
function cvbox(b){const vw=video.videoWidth,vh=video.videoHeight,cw=canvas.width,ch=canvas.height;if(!vw||!vh)return null;const vr=vw/vh,cr=cw/ch;let dw,dh,ox=0,oy=0;if(vr>cr){dw=cw;dh=cw/vr;oy=(ch-dh)/2}else{dh=ch;dw=ch*vr;ox=(cw-dw)/2}return{x:ox+b[0]/vw*dw,y:oy+b[1]/vh*dh,w:b[2]/vw*dw,h:b[3]/vh*dh}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);dets.forEach((d,i)=>{const b=cvbox(d.bbox);if(!b)return;const isT=target&&target.det===d;ctx.strokeStyle=isT?'#9ee6af':'#7798ff';ctx.lineWidth=(isT?5:3)*devicePixelRatio;ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.fillStyle=ctx.strokeStyle;ctx.font=`${12*devicePixelRatio}px sans-serif`;ctx.fillText(isT?'残す人物':`人物 ${i+1}`,b.x+4,b.y+14*devicePixelRatio)})}
function iou(a,b){const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1),u=a[2]*a[3]+b[2]*b[3]-inter;return u?inter/u:0}
function match(prev,people){let best=null,score=-9;const pc=[prev[0]+prev[2]/2,prev[1]+prev[3]/2];for(const d of people){const c=[d.bbox[0]+d.bbox[2]/2,d.bbox[1]+d.bbox[3]/2],dist=Math.hypot((c[0]-pc[0])/video.videoWidth,(c[1]-pc[1])/video.videoHeight),s=iou(prev,d.bbox)*2.5-dist;if(s>score){score=s;best=d}}return score>-0.38?best:null}
async function detect(){if(!mdl||busy||video.readyState<2)return;busy=true;try{const p=(await mdl.detect(video,20,0.32)).filter(x=>x.class==='person');const prev=target?.box?[...target.box]:null;dets=p;if(target&&prev){const m=match(prev,p);if(m){target={det:m,box:[...m.bbox]};track.innerHTML='<span class="good">✓ 人物を追跡中</span>'}else track.innerHTML='<span class="warn">人物を一時的に見失いました…</span>'}draw()}finally{busy=false}}
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);video.src=url;target=null;dets=[];play.disabled=reset.disabled=true;meta.textContent=f.name;video.onloadedmetadata=()=>{video.currentTime=Math.min(.2,video.duration||0);meta.textContent=`${f.name} / ${ft(video.duration||0)} / ${video.videoWidth}×${video.videoHeight}`;seekrow.style.display='block'};video.onseeked=async()=>{hint.style.display='none';video.style.display='block';canvas.style.display='block';fit();await detect();timeEl.textContent=ft(video.currentTime||0)}}
seek.oninput=()=>{if(!video.duration)return;video.pause();tracking=false;play.textContent='▶ 追跡テスト';video.currentTime=Number(seek.value)/1000*video.duration}
canvas.onpointerdown=e=>{const r=canvas.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*canvas.width,py=(e.clientY-r.top)/r.height*canvas.height;let ch=null,area=Infinity;for(const d of dets){const b=cvbox(d.bbox);if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h&&b.w*b.h<area){ch=d;area=b.w*b.h}}if(ch){target={det:ch,box:[...ch.bbox]};targetEl.innerHTML='<span class="good">✓ 残す人物を指定しました</span>';track.textContent='追跡準備OK。再生して確認できます。';play.disabled=reset.disabled=false;draw()}}
reset.onclick=()=>{target=null;targetEl.textContent='まだ指定されていません';track.textContent='人物を選び直してください。';play.disabled=reset.disabled=true;draw()}
play.onclick=async()=>{if(!target)return;if(video.paused){tracking=true;await video.play();play.textContent='⏸ 停止'}else{tracking=false;video.pause();play.textContent='▶ 追跡テスト'}}
video.ontimeupdate=()=>{if(video.duration)seek.value=Math.round(video.currentTime/video.duration*1000);timeEl.textContent=ft(video.currentTime||0)}
async function loop(ts){if(tracking&&!video.paused&&mdl&&!busy&&ts-last>220){last=ts;await detect()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.onresize=()=>{if(video.style.display==='block'){fit();draw()}}
</script></body></html>
