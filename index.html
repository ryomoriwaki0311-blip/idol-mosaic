<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idol Mosaic v5.2</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--muted:#939caf;--text:#f7f8fb;--accent:#7798ff;--line:#283040;--good:#9ee6af;--warn:#ffd479}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:0 0 5px}.version{font-size:12px;color:var(--muted)}.sub,.note,.meta{color:var(--muted);font-size:12px;line-height:1.65}.sub{font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:13px 0}.step{font-weight:800;font-size:17px;margin-bottom:12px}
.filebox{display:block;border:1px dashed #46526b;border-radius:15px;padding:16px;text-align:center;background:#0f131b;font-weight:700}input[type=file]{display:none}
.stage{position:relative;background:#050608;border-radius:16px;overflow:hidden;min-height:220px;display:grid;place-items:center}.hint{color:var(--muted);padding:40px 20px;text-align:center}
video{display:none;width:100%;max-height:66vh;background:#000}canvas{display:none;position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.seekrow{display:none;margin-top:12px}input[type=range]{width:100%}.labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
button{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;background:#242b3a;color:#fff;width:100%}button.primary{background:var(--accent)}button:disabled{opacity:.4}
.status{margin-top:10px;font-size:13px;line-height:1.5}.good{color:var(--good)}.warn{color:var(--warn)}
.progress{height:10px;background:#252c3a;border-radius:999px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:var(--accent);transition:.25s}
.diag{display:none;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0f131b;color:#dce2ef;font-size:12px;line-height:1.6;font-variant-numeric:tabular-nums}
.resultVideo{width:100%;border-radius:14px;background:#000;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>アイドル以外モザイク <span class="version">v5.2 / SAM2</span></h1>
<div class="sub">サーバーAI追跡テスト。人物を1点タップすると、SAM2がその人物を動画全体で追跡します。</div>
<section class="card"><div class="step">1. 動画を選ぶ</div><label class="filebox" for="file">動画を選択</label><input id="file" type="file" accept="video/*"><div id="meta" class="meta"></div></section>
<section class="card"><div class="step">2. 残したい人物をタップ</div><div class="stage"><div id="hint" class="hint">動画を選ぶとフレームを表示します</div><video id="video" playsinline muted preload="metadata"></video><canvas id="canvas"></canvas></div><div id="seekrow" class="seekrow"><input id="seek" type="range" min="0" max="1000" value="0"><div class="labels"><span>指定フレーム</span><span id="time">0:00</span></div></div><div id="pointStatus" class="status">まだ指定されていません</div></section>
<section class="card"><div class="step">3. SAM2で追跡</div><button id="run" class="primary" disabled>SAM2で人物を追跡する</button><div id="status" class="status">準備待ち</div><div class="progress"><div id="bar" class="bar"></div></div><div id="uploadDiag" class="diag"></div><div class="note">動画はVercel Blobへ一時アップロードし、SAM2処理用URLとして利用します。v5.2ではmultipartをOFFにして切り分け中です。</div></section>
<section id="resultCard" class="card" style="display:none"><div class="step">4. 追跡結果</div><div class="note">まずは「選んだ人物を最後まで追えているか」だけ確認してください。</div><video id="resultVideo" class="resultVideo" playsinline controls></video></section>
</div>
<script type="module">
import { upload } from 'https://esm.sh/@vercel/blob@2.4.0/client';
const q=id=>document.getElementById(id);
const file=q('file'),video=q('video'),canvas=q('canvas'),ctx=canvas.getContext('2d'),hint=q('hint'),meta=q('meta'),seek=q('seek'),seekrow=q('seekrow'),time=q('time'),pointStatus=q('pointStatus'),run=q('run'),status=q('status'),bar=q('bar'),uploadDiag=q('uploadDiag'),resultCard=q('resultCard'),resultVideo=q('resultVideo');
let objectUrl=null, chosen=null, frameIndex=0, fps=30;
const ft=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const fb=n=>{if(!Number.isFinite(n)||n<0)return '---';if(n<1024)return `${n} B`;if(n<1024**2)return `${(n/1024).toFixed(1)} KB`;if(n<1024**3)return `${(n/1024**2).toFixed(1)} MB`;return `${(n/1024**3).toFixed(2)} GB`};
const elapsed=s=>{const x=Math.max(0,Math.floor(s));return `${Math.floor(x/60)}:${String(x%60).padStart(2,'0')}`};
function fit(){const r=video.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!chosen)return;const x=chosen.cx*canvas.width,y=chosen.cy*canvas.height,r=22*devicePixelRatio;ctx.strokeStyle='#9ee6af';ctx.lineWidth=4*devicePixelRatio;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x-r-8,y);ctx.lineTo(x+r+8,y);ctx.moveTo(x,y-r-8);ctx.lineTo(x,y+r+8);ctx.stroke()}
function canvasToVideo(cx,cy){const vw=video.videoWidth,vh=video.videoHeight,cw=canvas.width,ch=canvas.height;const vr=vw/vh,cr=cw/ch;let dw,dh,ox=0,oy=0;if(vr>cr){dw=cw;dh=cw/vr;oy=(ch-dh)/2}else{dh=ch;dw=ch*vr;ox=(cw-dw)/2}const x=Math.round((cx*cw-ox)/dw*vw), y=Math.round((cy*ch-oy)/dh*vh);return {x:Math.max(0,Math.min(vw-1,x)),y:Math.max(0,Math.min(vh-1,y))}}
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);video.src=objectUrl;chosen=null;run.disabled=true;pointStatus.textContent='まだ指定されていません';uploadDiag.style.display='none';uploadDiag.textContent='';meta.textContent=`${f.name} / ${(f.size/1024/1024).toFixed(1)} MB`;video.onloadedmetadata=()=>{video.currentTime=Math.min(.2,video.duration||0);meta.textContent+=` / ${video.videoWidth}×${video.videoHeight} / ${ft(video.duration)}`;seekrow.style.display='block'};video.onseeked=()=>{hint.style.display='none';video.style.display='block';canvas.style.display='block';fit();draw();time.textContent=ft(video.currentTime);frameIndex=Math.max(0,Math.round(video.currentTime*fps))}}
seek.oninput=()=>{if(!video.duration)return;video.currentTime=Number(seek.value)/1000*video.duration};
canvas.onpointerdown=e=>{const r=canvas.getBoundingClientRect(),cx=(e.clientX-r.left)/r.width,cy=(e.clientY-r.top)/r.height;const p=canvasToVideo(cx,cy);chosen={cx,cy,x:p.x,y:p.y};frameIndex=Math.max(0,Math.round(video.currentTime*fps));pointStatus.innerHTML=`<span class="good">✓ 指定済み：(${p.x}, ${p.y}) / frame ${frameIndex}</span>`;run.disabled=false;draw()};
async function poll(id){for(let i=0;i<180;i++){await new Promise(r=>setTimeout(r,2000));const res=await fetch(`/api/status?id=${encodeURIComponent(id)}`);const j=await res.json();if(!res.ok)throw new Error(j.error||'status error');if(j.status==='succeeded')return j;if(j.status==='failed'||j.status==='canceled')throw new Error(j.error||'SAM2処理に失敗');bar.style.width=`${Math.min(92,35+i/2)}%`;status.textContent=`SAM2処理中… ${j.status}`}throw new Error('処理がタイムアウトしました')}
run.onclick=async()=>{const f=file.files?.[0];if(!f||!chosen)return;run.disabled=true;resultCard.style.display='none';const started=performance.now();let lastBytes=0,lastAt=started,lastSpeed=0,lastProgressAt=started;try{status.textContent='動画をアップロード中…';bar.style.width='10%';uploadDiag.style.display='block';uploadDiag.innerHTML=`接続開始…<br>ファイル：${fb(f.size)}<br>経過：0:00`;const blob=await upload(`idol-mosaic/${Date.now()}-${f.name}`,f,{access:'public',handleUploadUrl:'/api/upload',onUploadProgress:p=>{const now=performance.now();const loaded=Number(p.loaded??p.loadedBytes??0);const total=Number(p.total??p.totalBytes??f.size);const pct=Number.isFinite(p.percentage)?p.percentage:(total>0?loaded/total*100:0);if(loaded>lastBytes&&now>lastAt){const instant=(loaded-lastBytes)/((now-lastAt)/1000);lastSpeed=lastSpeed?lastSpeed*.65+instant*.35:instant;lastBytes=loaded;lastAt=now;lastProgressAt=now}const eta=lastSpeed>0&&total>loaded?(total-loaded)/lastSpeed:null;const stalled=(now-lastProgressAt)>12000;bar.style.width=`${10+Math.round(Math.max(0,Math.min(100,pct))*.2)}%`;uploadDiag.innerHTML=`送信：${fb(loaded)} / ${fb(total)}（${pct.toFixed(1)}%）<br>速度：${lastSpeed>0?`${fb(lastSpeed)}/秒`:'計測中…'}${eta!=null?`　残り目安：${elapsed(eta)}`:''}<br>経過：${elapsed((now-started)/1000)}${stalled?'<br><span class="warn">⚠ 12秒以上データが進んでいません</span>':''}`}});const uploadSec=(performance.now()-started)/1000;uploadDiag.innerHTML=`<span class="good">✓ アップロード完了</span><br>${fb(f.size)} / ${elapsed(uploadSec)}${lastSpeed>0?` / 平均目安 ${fb(f.size/uploadSec)}/秒`:''}`;status.textContent='SAM2ジョブを開始中…';bar.style.width='32%';const res=await fetch('/api/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({videoUrl:blob.url,x:chosen.x,y:chosen.y,frameIndex,fps})});const j=await res.json();if(!res.ok)throw new Error(j.error||'開始失敗');const done=await poll(j.id);bar.style.width='100%';status.innerHTML='<span class="good">✓ SAM2追跡完了</span>';resultVideo.src=done.outputUrl;resultCard.style.display='block'}catch(e){console.error(e);status.innerHTML=`<span class="warn">エラー：${e.message}</span>`;bar.style.width='0%';uploadDiag.style.display='block';if(!uploadDiag.textContent.includes('アップロード完了'))uploadDiag.innerHTML+=`<br><span class="warn">停止：${e.message}</span>`}finally{run.disabled=false}};
window.onresize=()=>{if(video.style.display==='block'){fit();draw()}};
</script>
</body></html>
