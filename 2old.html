<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idol Mosaic v1</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--muted:#8f98aa;--text:#f7f8fb;--accent:#7c9cff;--line:#262c38}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:720px;margin:auto;padding:20px 16px calc(36px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:8px 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.step{display:flex;gap:10px;align-items:center;font-weight:700;margin-bottom:12px}
.badge{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:white;font-size:14px}
input[type=file]{width:100%;padding:14px;border:1px dashed #455067;border-radius:14px;background:#0f131b;color:white}
.stage{position:relative;background:#050608;border-radius:14px;overflow:hidden;min-height:220px;display:grid;place-items:center}
video{width:100%;max-height:65vh;display:none;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;display:none}
.hint{color:var(--muted);text-align:center;padding:32px 18px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0f131b}
.opt input{margin-right:8px}
button{width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:800}
.primary{background:var(--accent);color:#fff}.secondary{background:#232a38;color:#fff;margin-top:10px}
button:disabled{opacity:.4}.info{font-size:13px;color:var(--muted);line-height:1.6}
.target{font-size:13px;margin-top:10px;color:#cdd5e5}.ok{color:#9ee6af}
</style>
</head>
<body>
<div class="wrap">
  <h1>アイドル以外モザイク <small style="font-size:12px;color:#8f98aa">v1</small></h1>
  <div class="sub">まずは操作感テスト版。動画はこの端末内で読み込みます。</div>

  <section class="card">
    <div class="step"><span class="badge">1</span>動画を選ぶ</div>
    <input id="file" type="file" accept="video/*">
    <div id="meta" class="info" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <div class="step"><span class="badge">2</span>残したいアイドルをタップ</div>
    <div id="stage" class="stage">
      <div id="hint" class="hint">動画を選ぶと最初のフレームを表示します</div>
      <video id="video" playsinline muted preload="metadata"></video>
      <canvas id="canvas"></canvas>
    </div>
    <div id="targetInfo" class="target">まだ指定されていません</div>
    <button id="resetTarget" class="secondary" disabled>指定をやり直す</button>
  </section>

  <section class="card">
    <div class="step"><span class="badge">3</span>モザイク方法</div>
    <div class="controls">
      <label class="opt"><input type="radio" name="mode" value="face" checked>顔だけ</label>
      <label class="opt"><input type="radio" name="mode" value="body">全身</label>
    </div>
  </section>

  <section class="card">
    <div class="step"><span class="badge">4</span>処理</div>
    <button id="process" class="primary" disabled>この設定で処理する</button>
    <div class="info" style="margin-top:10px">v1ではここまで。次の版で人物検出・追跡・モザイク処理サーバーへ接続します。</div>
  </section>
</div>

<script>
const fileInput=document.getElementById('file'),video=document.getElementById('video'),
canvas=document.getElementById('canvas'),hint=document.getElementById('hint'),
meta=document.getElementById('meta'),targetInfo=document.getElementById('targetInfo'),
resetTarget=document.getElementById('resetTarget'),processBtn=document.getElementById('process'),
ctx=canvas.getContext('2d');
let target=null,objectUrl=null;
const fmtSize=n=>n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const fmtTime=sec=>`${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`;
function fitCanvas(){const r=video.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*devicePixelRatio));canvas.height=Math.max(1,Math.round(r.height*devicePixelRatio));canvas.style.width=r.width+'px';canvas.style.height=r.height+'px'}
function drawTarget(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!target)return;const x=target.x*canvas.width,y=target.y*canvas.height,r=24*devicePixelRatio;ctx.lineWidth=4*devicePixelRatio;ctx.strokeStyle='#7c9cff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(124,156,255,.18)';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2*devicePixelRatio;ctx.beginPath();ctx.moveTo(x-r-8*devicePixelRatio,y);ctx.lineTo(x+r+8*devicePixelRatio,y);ctx.moveTo(x,y-r-8*devicePixelRatio);ctx.lineTo(x,y+r+8*devicePixelRatio);ctx.stroke()}
fileInput.addEventListener('change',()=>{const f=fileInput.files?.[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);video.src=objectUrl;target=null;processBtn.disabled=true;resetTarget.disabled=true;targetInfo.textContent='まだ指定されていません';meta.textContent=`${f.name} / ${fmtSize(f.size)}`;video.onloadedmetadata=()=>{video.currentTime=Math.min(.15,Math.max(0,video.duration/100));meta.textContent=`${f.name} / ${fmtSize(f.size)} / ${fmtTime(video.duration)} / ${video.videoWidth}×${video.videoHeight}`};video.onseeked=()=>{hint.style.display='none';video.style.display='block';canvas.style.display='block';requestAnimationFrame(()=>{fitCanvas();drawTarget()})}});
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();target={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};drawTarget();targetInfo.innerHTML='<span class="ok">✓ 残す人物を指定しました</span>';resetTarget.disabled=false;processBtn.disabled=false});
resetTarget.addEventListener('click',()=>{target=null;drawTarget();targetInfo.textContent='まだ指定されていません';resetTarget.disabled=true;processBtn.disabled=true});
processBtn.addEventListener('click',()=>{const mode=document.querySelector('input[name=mode]:checked').value;alert(`設定OK！\n残す人物：指定済み\nモザイク：${mode==='face'?'顔だけ':'全身'}\n\n次版でAI処理に接続します。`)});
window.addEventListener('resize',()=>{if(video.style.display==='block'){fitCanvas();drawTarget()}});
</script>
</body>
</html>
